[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aeo-agent"
version = "1.1.0"
description = "AEO Agent — analyze any website's visibility on ChatGPT, Gemini & Google AI Overview."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Asiya Arab", url = "https://github.com/Asiyaarab" }]
keywords = ["aeo", "geo", "seo", "answer-engine-optimization", "chatgpt", "gemini", "google-ai", "ai-visibility"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Flask",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: Site Management :: Site Monitoring",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

[project.urls]
Homepage = "https://github.com/Asiyaarab/AeoAgent"
Repository = "https://github.com/Asiyaarab/AeoAgent"
Issues = "https://github.com/Asiyaarab/AeoAgent/issues"
Changelog = "https://github.com/Asiyaarab/AeoAgent/blob/main/CHANGELOG.md"

[project.scripts]
aeo-agent = "main:main"

# ── Tooling ────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "E501",   # line length handled by formatter
    "B008",   # function-call-in-default-arg (Flask uses this everywhere)
    "RUF012", # mutable class attributes
]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
disallow_untyped_defs = false
warn_unused_ignores = true
warn_return_any = false
exclude = ["tests/", ".venv/"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-v --tb=short"
filterwarnings = ["ignore::DeprecationWarning"]
